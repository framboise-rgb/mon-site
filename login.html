<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberVPN — Connexion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>Cyber</span><strong>VPN</strong>
        </div>

        <button class="menu-button" onclick="toggleMenu()">
            ☰
        </button>

        <nav id="menu">
            <a href="index.html">Accueil</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Connexion</a>
        </nav>

    </header>


    <main>

        <section class="login-page">

            <div class="login-box">

                <p class="login-small">
                    CYBERVPN
                </p>

                <h1>
                    Connexion
                </h1>

                <p class="login-description">
                    Connectez-vous à votre compte CyberVPN.
                </p>


                <form id="loginForm">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Votre adresse e-mail"
                        required
                    >


                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        required
                    >


                    <button type="submit">
                        Se connecter
                    </button>

                </form>


                <p class="login-register">
                    Vous n'avez pas encore de compte ?
                    <a href="register.html">Créer un compte</a>
                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-content">

            <div class="footer-logo">
                <span>Cyber</span><strong>VPN</strong>
            </div>

            <p>
                Une navigation plus sécurisée, simplement.
            </p>

            <div class="footer-links">
                <a href="index.html">Accueil</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
                <a href="login.html">Connexion</a>
            </div>

            <p class="copyright">
                © 2026 CyberVPN. Tous droits réservés.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
